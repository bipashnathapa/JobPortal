services:
  - type: web
    name: stepup-backend
    env: python
    buildCommand: "./server/build.sh"
    startCommand: "gunicorn server.wsgi:application --bind 0.0.0.0:$PORT --chdir server"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-app-url.vercel.app" # UPDATE THIS AFTER VERCEL DEPLOYMENT
      - key: MONGO_URI
        value: "mongodb+srv://<username>:<password>@cluster0.mongodb.net/Job_portal?retryWrites=true&w=majority" # UPDATE THIS
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        value: "thapa.bipashnaa@gmail.com"
      # IMPORTANT: Add these secrets in the Render dashboard, do not hardcode them here!
      # - EMAIL_HOST_USER
      # - EMAIL_HOST_PASSWORD
      # - GROQ_API_KEY
